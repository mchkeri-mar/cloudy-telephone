<style>

<header class="top">
  <img src="https://a.sfdcstatic.com/shared/images/c360-nav/salesforce-with-type-logo.svg" alt="Salesforce">

<script>
/* ============================ PROMPT DECK ============================ */
const PROMPTS = [
"Astro surfing a giant spreadsheet","Codey stuck in an infinite Flow loop","Einstein getting a speeding ticket for breaking a governor limit",
"Cloudy the goat eating duplicate records","An Agentforce agent ordering pizza for the whole hackathon","A Trailhead badge-eating contest",
"Data Cloud spilling customer data like a milkshake","Deploying to production at 4:59pm on a Friday","An Opportunity running away from a sales rep",
"Astro doing yoga to reach 100% code coverage","A Lead getting a makeover to become a Contact","Slack notifications chasing someone on vacation",
"A validation rule working as a nightclub bouncer","Codey lifting weights made of Apex classes","A dashboard that only shows pictures of cats",
"Einstein predicting the weather inside a server room","A sandbox at the beach with a production lifeguard","Astro and Codey on a tandem bike to Dreamforce",
"A record trying to sneak past a sharing rule","A chatbot falling in love with a toaster","A forgotten test class crying in the corner",
"The cloud wearing sunglasses at a hackathon","A sales forecast written inside a fortune cookie","A Case escalating up a giant staircase",
"Cloudy the goat presenting a slide deck","An admin with ten arms clicking Setup menus","A report with so many filters it got tangled",
"Codey hibernating during a release freeze","A merge field that lost its curly braces","Astro walking a pet API on a leash",
"An approval process waiting forever at a bus stop","A data import arriving on a pirate ship","Einstein in a VR headset seeing dollar signs",
"A Kanban board where every card is a taco","A hackathon team powered only by coffee","An Apex trigger firing confetti everywhere",
"A tiny Agentforce agent with a giant to-do list","A Lightning page struck by actual lightning","Codey roasting marshmallows over a burning backlog",
"A Customer 360 view through binoculars","A login screen that asks you a riddle","A duplicate rule seeing double",
"The cloud raining Trailhead badges","Astro speed-running a Trailhead superbadge","A permission set guarding a treasure chest",
"A batch job snoring loudly at midnight","An org chart made of a cheerleader pyramid","Einstein trying to pronounce Kubernetes",
"A unicorn closing a million-dollar deal","Record types at a costume party","Cloudy the goat climbing Mount Backlog",
"A Slack huddle that is an actual huddle","A demo going perfectly until the Wi-Fi dies","A field label that is way too long",
"Astro DJing the Dreamforce party","A spreadsheet chasing an admin out of the office","A sales rep high-fiving a robot",
"A rubber duck debugging an Agentforce agent","A scheduled flow setting a hundred alarm clocks","Codey and Einstein arguing about tabs vs spaces"
];

/* ============================== HELPERS ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = v => v == null ? null : JSON.parse(JSON.stringify(v));
const isImg = c => typeof c === 'string' && /^data:image\/(jpeg|png);base64,[A-Za-z0-9+/=]+$/.test(c);
const mod = (a, n) => ((a % n) + n) % n;
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const dur = s => s === 0 ? 45 : (s % 2 ? 90 : 40);            // seconds per step
const stepType = s => s % 2 ? 'draw' : 'text';
const stepName = (s) => s === 0 ? 'Write' : (s % 2 ? 'Draw' : 'Describe');
const REACTS = ['😂', '❤️', '🔥', '😮', '👏'];
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
function floatEmoji(e) {
  const s = document.createElement('span'); s.className = 'fl'; s.textContent = e;
  s.style.left = (5 + Math.random() * 90) + '%'; s.style.fontSize = (34 + Math.random() * 30) + 'px';
  $('#float').appendChild(s); setTimeout(() => s.remove(), 3300);
}

const qs = new URLSearchParams(location.search);
const CONFIGURED = !!(FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('PASTE') && FIREBASE_CONFIG.databaseURL);
const DEMO = qs.has('demo') || !CONFIGURED;
const DEMO_Q = (DEMO && CONFIGURED) ? '&demo' : '';
const BASE = location.href.split('#')[0].split('?')[0];
let B = null, ROOM = '';
const R = () => `rooms/${ROOM}`;
const joinUrl = () => `${BASE}?room=${ROOM}${DEMO_Q}`;

/* ============================== BACKENDS ============================= */
async function initFirebase() {
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [A, D, U] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-database.js'), import(base + 'firebase-auth.js')]);
  const app = A.initializeApp(FIREBASE_CONFIG);
  const auth = U.getAuth(app);
  await U.signInAnonymously(auth);
  const db = D.getDatabase(app);
  let off = 0; D.onValue(D.ref(db, '.info/serverTimeOffset'), s => off = s.val() || 0);
  return {
    uid: auth.currentUser.uid,
    set: (p, v) => D.set(D.ref(db, p), v),
    update: (p, v) => D.update(D.ref(db, p), v),
    get: async p => (await D.get(D.ref(db, p))).val(),
    on: (p, cb) => D.onValue(D.ref(db, p), s => cb(s.val())),
    onDisconnectSet: (p, v) => D.onDisconnect(D.ref(db, p)).set(v),
    now: () => Date.now() + off
  };
}

// Practice mode: syncs browser tabs on one computer (no internet backend needed)
async function initDemo() {
  const ch = new BroadcastChannel('cloudy-telephone-demo');
  let tree = {}; try { tree = JSON.parse(localStorage.getItem('ct-demo') || '{}'); } catch (e) {}
  if (!window.name.startsWith('ct-')) window.name = 'ct-' + Math.random().toString(36).slice(2, 10);
  const uid = 'u' + window.name.slice(3);
  const ls = new Set(); let got = false, saveT;
  const parts = p => p.split('/').filter(Boolean);
  const getAt = p => { let n = tree; for (const k of parts(p)) { if (n == null || typeof n !== 'object') return null; n = n[k]; } return n === undefined ? null : n; };
  const setAt = (p, v) => {
    const ks = parts(p); if (!ks.length) { tree = v || {}; return; }
    let n = tree; for (let i = 0; i < ks.length - 1; i++) { if (typeof n[ks[i]] !== 'object' || n[ks[i]] === null) n[ks[i]] = {}; n = n[ks[i]]; }
    if (v === null || v === undefined) delete n[ks[ks.length - 1]]; else n[ks[ks.length - 1]] = v;
  };
  const notify = () => { for (const l of ls) l.fire(); clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem('ct-demo', JSON.stringify(tree)); } catch (e) {} }, 400); };
  const apply = op => { if (op.k === 'set') setAt(op.p, clone(op.v)); else for (const [k, v] of Object.entries(op.v)) setAt(op.p + '/' + k, clone(v)); };
  ch.onmessage = e => {
    const m = e.data;
    if (m.k === 'hello') { ch.postMessage({ k: 'state', tree }); return; }
    if (m.k === 'state') { if (!got) { got = true; tree = m.tree || {}; notify(); } return; }
    apply(m); notify();
  };
  ch.postMessage({ k: 'hello' });
  await sleep(300);
  got = true;
  const write = op => { apply(op); ch.postMessage(op); notify(); return Promise.resolve(); };
  return {
    uid,
    set: (p, v) => write({ k: 'set', p, v: v === undefined ? null : v }),
    update: (p, v) => write({ k: 'upd', p, v }),
    get: async p => clone(getAt(p)),
    on: (p, cb) => { let last; const l = { fire() { const v = getAt(p); const s = JSON.stringify(v); if (s !== last) { last = s; cb(clone(v)); } } }; ls.add(l); l.fire(); return () => ls.delete(l); },
    onDisconnectSet: () => {},
    now: () => Date.now()
  };
}

/* =============================== SHARED ============================== */
function entryHtml(e, s, old) {
  const verb = s === 0 ? 'wrote' : (s % 2 ? 'drew' : 'thought it was');
  const who = esc(e && e.n ? e.n : 'Someone');
  let body;
  if (!e || !e.c) body = `<div class="skip">(skipped this one 🤷)</div>`;
  else if (e.t === 'draw' && isImg(e.c)) body = `<img src="${e.c}" alt="Drawing by ${who}">`;
  else body = `<div class="bubble">${esc(e.c)}</div>`;
  return `<div class="entry${old ? ' old' : ''}"><div class="who">${who} ${verb}:</div>${body}</div>`;
}
function showBanner() {
  if (DEMO) $('#banner').innerHTML = `<div class="demo"><b>Practice mode:</b> only syncs browser tabs on this computer. ${CONFIGURED ? '' : 'Add your Firebase config to play with everyone.'}</div>`;
}
function setHdr(t) { const h = $('#hdr'); h.style.display = t ? '' : 'none'; h.textContent = t || ''; }

/* =============================== LANDING ============================= */
function renderLanding() {
  $('#app').innerHTML = `<div class="pwrap"><div class="card center">
    <div class="big-emoji">☁️📞🎨</div>
    <h1>Cloudy Telephone</h1>
    <p class="muted">Write a silly prompt, draw what you get, guess what you see, then watch the chaos unfold.</p>
    <div class="mt"><input id="code" maxlength="4" placeholder="ROOM CODE" style="text-align:center;text-transform:uppercase;letter-spacing:.3em;font-size:1.6rem"></div>
    <button class="btn big full mt" onclick="goJoin()">Join game</button>
    <p class="muted mt">Running the game?</p>
    <button class="btn sec" onclick="location.href='${BASE}?host${DEMO_Q}'">Host a new game</button>
  </div></div>`;
  $('#code').addEventListener('keydown', e => { if (e.key === 'Enter') goJoin(); });
}
function goJoin() { const c = $('#code').value.toUpperCase().replace(/[^A-Z]/g, ''); if (c.length !== 4) return toast('Enter the 4-letter room code'); location.href = `${BASE}?room=${c}${DEMO_Q}`; }

/* ================================ HOST =============================== */
let meta = null, players = {}, subs = {}, votes = {}, subsKey = null, subsOff = null, advKey = null, botKey = null, seenReact = {}, reactInit = false, bookCache = {}, hostTimer = null;
const ALLOW_BOTS = DEMO || qs.has('bots');
const BOTNAMES = ['Astro', 'Codey', 'Einstein', 'Cloudy', 'Appy', 'Brandy', 'Max', 'Ruth'];

async function hostCreate() {
  let code;
  for (let i = 0; i < 12; i++) { code = Array.from({ length: 4 }, () => rand('ABCDEFGHJKLMNPQRSTUVWXYZ'.split(''))).join(''); if (!(await B.get(`rooms/${code}/meta`))) break; }
  ROOM = code;
  await B.set(`${R()}/meta`, { hostUid: B.uid, state: 'lobby', round: 1, step: 0, steps: 5, stepDur: 0, stepEndsAt: 0, createdAt: B.now() });
  history.replaceState(null, '', `?host&room=${ROOM}${DEMO_Q}`);
  hostAttach();
}
function hostAttach() {
  setHdr('Room ' + ROOM + ' · Host');
  B.on(`${R()}/meta`, v => {
    if (!v) { $('#app').innerHTML = `<div class="pwrap"><div class="card center"><h2>Room ${esc(ROOM)} not found</h2><a class="btn" href="${BASE}?host${DEMO_Q}">Create a new room</a></div></div>`; return; }
    meta = v; hostSyncSubs(); hostBots(); hostRender();
  });
  B.on(`${R()}/players`, v => { players = v || {}; hostRender(); });
  B.on(`${R()}/votes`, v => { votes = v || {}; if (meta && meta.state === 'vote') hostRender(); });
  B.on(`${R()}/reactions`, v => {
    v = v || {};

/* ---- practice bots ---- */
async function addBots(n = 5) {

}
function botDrawing() {
  const c = document.createElement('canvas'); c.width = 800; c.height = 600; const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, 800, 600); x.lineCap = 'round'; x.lineJoin = 'round';
  const cols = ['#032D60', '#0176D3', '#00B3FF', '#2E844A', '#DD7A01', '#BA0517', '#080707'];
  for (let i = 0; i < 7; i++) {
    x.strokeStyle = rand(cols); x.lineWidth = 6 + Math.random() * 14; x.beginPath();
    let px = 100 + Math.random() * 600, py = 100 + Math.random() * 400; x.moveTo(px, py);
    for (let j = 0; j < 12; j++) { px = Math.max(20, Math.min(780, px + (Math.random() - .5) * 160)); py = Math.max(20, Math.min(580, py + (Math.random() - .5) * 160)); x.lineTo(px, py); }
    x.stroke();
  }
  x.beginPath(); x.arc(400, 300, 60 + Math.random() * 60, 0, Math.PI * 2); x.strokeStyle = '#080707'; x.lineWidth = 8; x.stroke();
  return c.toDataURL('image/jpeg', 0.6);
}
function hostBots() {
  if (!ALLOW_BOTS || !meta || meta.state !== 'play') return;
  const key = `${meta.round}-${meta.step}`; if (key === botKey) return; botKey = key;

      const type = stepType(step);
      const c = type === 'draw' ? botDrawing() : (step === 0 ? rand(PROMPTS) : 'Maybe ' + rand(PROMPTS).toLowerCase() + '?');
      B.set(`${R()}/books/r${round}/b${b}/s${step}`, { t: type, c, by: u, n: pname(u) });
      B.set(`${R()}/subs/r${round}s${step}/${u}`, true);

}

function renderDraw(input) {
  let pr, note = '';
  if (input && input.c && String(input.c).trim()) pr = String(input.c);
  else { pr = rand(PROMPTS); note = `<div class="muted" style="font-size:.9rem">Your prompt got lost in the cloud ☁️ so here's one from us.</div>`; }
  pCtx.prompt = pr;
  $('#app').innerHTML = `<div class="pwrap">${timerHtml()}<div class="card">
    <div class="muted">🎨 Draw this:</div><div class="prompt">${esc(pr)}</div>${note}
    <div class="tools">${COLORS.map(c => `<button class="sw ${c === color && !erasing ? 'on' : ''}" style="background:${c}" onclick="setColor('${c}')" aria-label="color"></button>`).join('')}</div>
    <canvas id="cv" class="draw"></canvas>
    <div class="tools">${[4, 10, 22].map(n => `<button class="tb sz ${n === size ? 'on' : ''}" data-s="${n}" onclick="setSize(${n})"><span class="dot" style="width:${n / 1.4 + 3}px;height:${n / 1.4 + 3}px"></span></button>`).join('')}
      <button class="tb ${erasing ? 'on' : ''}" id="er" onclick="toggleEraser()">Eraser</button>
      <button class="tb" onclick="undo()">↶ Undo</button><button class="tb" onclick="clearCv()">Clear</button>
      <button class="btn" style="margin-left:auto" onclick="submitDraw()">Done ✓</button></div>
  </div></div>`;
  initCanvas(); playerTick();
}
function initCanvas() {
  cv = $('#cv'); cv.width = 800; cv.height = 600; cx = cv.getContext('2d'); strokes = []; cur = null; redraw();
  const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.onpointerdown = e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {} cur = { c: erasing ? '#FFFFFF' : color, w: erasing ? size * 2.5 : size, p: [pt(e)] }; strokes.push(cur); drawStroke(cur); };
  cv.onpointermove = e => {
    if (!cur) return; e.preventDefault(); const q = pt(e), l = cur.p[cur.p.length - 1]; cur.p.push(q);
    cx.strokeStyle = cur.c; cx.lineWidth = cur.w; cx.lineCap = 'round'; cx.lineJoin = 'round'; cx.beginPath(); cx.moveTo(l[0], l[1]); cx.lineTo(q[0], q[1]); cx.stroke();
  };
  cv.onpointerup = cv.onpointercancel = cv.onpointerleave = () => { cur = null; };
}
function drawStroke(s) {
  cx.strokeStyle = s.c; cx.fillStyle = s.c; cx.lineWidth = s.w; cx.lineCap = 'round'; cx.lineJoin = 'round';
  if (s.p.length === 1) { cx.beginPath(); cx.arc(s.p[0][0], s.p[0][1], s.w / 2, 0, Math.PI * 2); cx.fill(); return; }
  cx.beginPath(); cx.moveTo(s.p[0][0], s.p[0][1]); for (let i = 1; i < s.p.length; i++) cx.lineTo(s.p[i][0], s.p[i][1]); cx.stroke();
}
function redraw() { cx.fillStyle = '#fff'; cx.fillRect(0, 0, 800, 600); strokes.forEach(drawStroke); }
function setColor(c) { color = c; erasing = false; document.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.style.background && b.getAttribute('onclick').includes(c))); const er = $('#er'); if (er) er.classList.remove('on'); }
function setSize(n) { size = n; document.querySelectorAll('.sz').forEach(b => b.classList.toggle('on', +b.dataset.s === n)); }
function toggleEraser() { erasing = !erasing; $('#er').classList.toggle('on', erasing); document.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', !erasing && b.getAttribute('onclick').includes(color))); }
function undo() { strokes.pop(); redraw(); }
function clearCv() { if (strokes.length && confirm('Clear your whole drawing?')) { strokes = []; redraw(); } }
function drawValue() { return (cv && strokes.length) ? cv.toDataURL('image/jpeg', 0.6) : ''; }
function submitDraw() { doSubmit('draw', drawValue()); }

/* ---- submit / wait ---- */
async function doSubmit(type, c) {
  if (submitted || !pCtx) return;
  submitted = true;
  const { round, s, b, key } = pCtx;
  try {
    await B.set(`${R()}/books/r${round}/b${b}/s${s}`, { t: type, c: c || '', by: B.uid, n: me.name });
    await B.set(`${R()}/subs/r${round}s${s}/${B.uid}`, true);
  } catch (e) { console.error(e); submitted = false; toast('Connection hiccup, retrying…'); setTimeout(() => { if (pKey === key) doSubmit(type, c); }, 1200); return; }
  if (pKey === key) renderWaiting();
}
function renderWaiting() {
  const m = pMeta, N = (m.order || []).length;
  const fun = ['Stretch those drawing fingers ✋', 'Hydrate! 💧', 'Rate your own art out of 10 🤔', 'Practice your poker face 😐', 'Think of a good excuse for that drawing 😅'];
  $('#app').innerHTML = `<div class="pwrap">${timerHtml()}<div class="card center"><div class="big-emoji">✅</div><h2>Sent!</h2>
    <p>Waiting for everyone else… <b id="wcnt"></b></p><p class="muted">${rand(fun)}</p></div></div>`;
  if (pSubsOff) pSubsOff();
  pSubsOff = B.on(`${R()}/subs/r${m.round}s${m.step}`, v => { const el = $('#wcnt'); if (el) el.textContent = `${Object.keys(v || {}).length} / ${N} done`; });
  playerTick();
}
function playerTick() {
  if (!pMeta || pMeta.state !== 'play' || !pCtx) return;
  const ms = pMeta.stepEndsAt - B.now(), left = Math.max(0, Math.ceil(ms / 1000));
  const t = $('#ptime'); if (t) t.textContent = `⏱ ${fmt(Math.min(left, pMeta.stepDur))}`;
  const st = $('#pstep'); if (st) st.textContent = `Step ${pMeta.step + 1} of ${pMeta.steps} · ${stepName(pMeta.step)}`;
  const bar = $('#pbar'); if (bar) { bar.style.width = Math.max(0, Math.min(100, ms / (pMeta.stepDur * 10))) + '%'; bar.parentElement.classList.toggle('low', ms < 10000); }
  if (!submitted && ms <= 400 && pCtx.key === pKey) {
    const c = pCtx.type === 'draw' ? ($('#cv') ? drawValue() : '') : textValue();
    doSubmit(pCtx.type, c); toast("⏰ Time's up! Sent what you had.");
  }
}

/* ---- reactions, votes, my book ---- */
function react(e) { const n = Date.now(); if (n - lastReact < 350) return; lastReact = n; floatEmoji(e); B.set(`${R()}/reactions/${B.uid}`, { e, t: B.now() }); }
function vote(b) { myVote = b; document.querySelectorAll('.cand').forEach(x => x.classList.toggle('on', x.id === 'c' + b)); B.set(`${R()}/votes/${B.uid}`, b); toast('Vote saved'); }
async function openMyBook() {
  const m = pMeta, p = (m.order || []).indexOf(B.uid);
  if (p < 0) return toast("You didn't start a chain this round");
  const bk = (await B.get(`${R()}/books/r${m.round}/b${p}`)) || {};
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<div class="card"><div class="row between"><h2 style="margin:0">📖 Your chain</h2><button class="btn sec" onclick="this.closest('.modal').remove()">Close</button></div>
    ${Array.from({ length: m.steps }, (_, s) => entryHtml(bk['s' + s], s)).join('')}</div>`;
  d.addEventListener('click', e => { if (e.target === d) d.remove(); });
  document.body.appendChild(d);
}

/* ================================ BOOT =============================== */
(async () => {
  showBanner();
  try { B = DEMO ? await initDemo() : await initFirebase(); }
  catch (e) {
    console.error(e);
    $('#app').innerHTML = `<div class="pwrap"><div class="card"><h2>Couldn't connect to the game server</h2><p class="muted">${esc(e.message || e)}</p>
      <p>Check the Firebase setup steps (Realtime Database created, Anonymous sign-in enabled, config pasted correctly). You can also <a href="${BASE}?demo">try practice mode</a>.</p></div></div>`;
    return;
  }
  ROOM = (qs.get('room') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  if (qs.has('host')) { if (ROOM) hostAttach(); else hostCreate(); }
  else if (ROOM) playerStart();
  else renderLanding();
})();
